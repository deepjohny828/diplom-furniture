{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>
    {% block title %}{% endblock title %}
</title>
  <link rel="stylesheet" href="{% static 'crm/css/diagram.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root{
    --color-bg-main: #FFFFFF;
    --color-bg-secondary: #FAF6F0;
    --color-text-primary: #2C3E50;
    --color-text-secondary: #5D6D7E;
    --color-accent-green: #7A9E7E;
    --color-accent-pink: #E8C4C4;
    --color-border: rgba(0, 0, 0, 0.05);
    
    /* Отступы */
    --padding-section: 20px;
    --padding-card: 15px;
    
    /* Доп переменные для замены --danger-color и --success-color */
    --danger-color: #E8C4C4; /* Используем акцентный розовый */
    --success-color: #7A9E7E; /* Используем акцентный зеленый */
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: var(--color-bg-main);
        color: var(--color-text-primary);
    }
    li{
        list-style: none;
    }
    a{
        color:color-text-primary;
        text-decoration: none;
        color: var(--color-text-secondary);
    }
    header {
      color: white;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }

    header button {
      background: var(--color-bg-main);
      color: var(--color-bg-secondary);
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    header button:hover {
      background: #f1f1f1;
    }

    #div-myChart {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      max-height: 600px;
      height: 60vw;
    }

    #myChart {
      width: 100% !important;
      height: 100% !important;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
    }

    .crm-entry {
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .paginator {
      text-align: center;
      margin-top: 20px;
    }

    .paginator a {
      margin: 0 5px;
      text-decoration: none;
      color: #4CAF50;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 8% auto;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 28px;
      color: #aaa;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }

    form input, form select {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    form button {
      width: 100%;
      padding: 10px;
      background-color: var(--color-accent-green);
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    form button:hover {
      background-color: var(--color-accent-green);
      opacity: 0.9;
    }
    .chart-controls {
    text-align: right;
    margin-bottom: 10px;
    }

    .chart-toggle-btn {
    background-color: var(--color-accent-green);
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    }

    .chart-toggle-btn:hover {
        background-color: var(--color-accent-green);
        opacity: 0.9;
    }

    .arrow-icon {
    display: inline-block;
    margin-right: 5px;
    transition: transform 0.3s;
    }
    

    .product-views-table {
    width: 100%;
    margin: 20px 0;
    overflow-x: auto;
  }

  .product-views-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .product-views-table th {
    background-color: #f5f7fa;
    color: #333;
    font-weight: 600;
    text-align: left;
    padding: 12px 15px;
    border-bottom: 2px solid #e1e5eb;
    text-align: center;
  }

  .product-views-table td {
    padding: 12px 15px;
    border-bottom: 1px solid #e1e5eb;
    vertical-align: top;
  }

  .product-views-table tr:hover {
    background-color: #f8f9fa;
    
  }

  .product-name {
    width: 50%;
    text-align: center;
    font-family: monospace;
  }

  .views-count {
    width: 20%;
    text-align: right;
    font-family: monospace;
    text-align: center;
  }

  .last-viewed {
    width: 30%;
    font-family: monospace;
    text-align: center;
  }

  /* Адаптивность */
  @media (max-width: 768px) {
    .product-views-table th, 
    .product-views-table td {
      padding: 8px 10px;
      font-size: 13px;
    }
    
    .product-name {
      width: 40%;
    }
    
    .last-viewed {
      width: 35%;
    }
  }
  </style>
</head>
<body>
    <header>
        <ul>
            <li>
                <a href={% url "crm_index" %}>Расходы и доходы</a>
            </li>
            <li>
                <a href={% url "view_count" %}>Количество просмотров</a>
            </li>
            <li>
              {% block other %}{% endblock other %}
            </li>
        </ul>
    </header>
{% block content %}
    
{% endblock content %}

{% block scripts %}


{% endblock scripts %}
</body>
</html>
